name: Deploy Docs

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      name:
        description: Repo name prefix used to derive package names (<name>-docs, <name>-site)
        required: true
        type: string
      use-turbo:
        description: Build content packages with pnpm turbo build (default true)
        required: false
        type: boolean
        default: true
      skip-content:
        description: Skip the content package build step (for repos with no <name>-docs package)
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build content packages
        if: ${{ !inputs.skip-content && inputs.use-turbo }}
        env:
          DOCS_NAME: ${{ inputs.name }}
        run: pnpm turbo build --filter=@theholocron/"$DOCS_NAME"-docs

      - name: Build content packages
        if: ${{ !inputs.skip-content && !inputs.use-turbo }}
        env:
          DOCS_NAME: ${{ inputs.name }}
        run: pnpm --filter @theholocron/"$DOCS_NAME"-docs build

      - name: Build docs site
        env:
          DOCS_NAME: ${{ inputs.name }}
        run: pnpm --filter @theholocron/"$DOCS_NAME"-site build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        name: Upload pages artifact
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
        name: Deploy to GitHub Pages
