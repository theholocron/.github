name: Security

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      language:
        description: CodeQL language to analyze
        type: string
        required: false
        default: javascript-typescript

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Do not cancel in-progress security scans.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        name: Initialize CodeQL
        with:
          languages: ${{ inputs.language }}

      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        name: Autobuild

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        name: Analyze
        with:
          category: /language:${{ inputs.language }}
