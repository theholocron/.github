name: Delivery

run-name: "${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('Deploy Preview: {0}', github.event.pull_request.title) || 'Deploy Preview' }}"

on: # yamllint disable-line rule:truthy
  pull_request:
    # `closed` runs the reusable's cleanup job, which deletes the PR's previews; its deploy and report jobs skip it.
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-deploy-${{ github.event.pull_request.number }}
  # Not true: a cancelled run could land between Vercel accepting the
  # upload and the report job posting a status, leaving a real preview
  # deployment with no corresponding GitHub check — worse than letting an
  # overlapping run for the same PR simply queue. It also keeps the cleanup on `closed` behind a deploy still running.
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  # Must be a superset of what the reusable workflow's own job requests
  # (holocron#1058) -- its new path-relevance check lists the PR's
  # changed files via the API (holocron#1023).
  pull-requests: read

jobs:
  preview-deploy:
    name: Preview Deploy
    uses: theholocron/.github/.github/workflows/delivery.previewDeploy.yml@main
    with:
      cwd: "."
    secrets: inherit
